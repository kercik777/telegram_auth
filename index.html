<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Авторизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1c92d2 0%, #f2fcfe 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 30px 35px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(42, 171, 238, 0.3);
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
            padding: 0 5px;
        }

        .widget-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            margin-bottom: 15px;
        }

        .note {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            line-height: 1.6;
        }

        .note svg {
            width: 12px;
            height: 12px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 4px;
            fill: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Иконка Telegram -->
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.96 6.502-1.358 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.015-.15-.056-.212-.07-.063-.174-.041-.25-.024-.106.024-1.793 1.14-5.06 3.345-.48.329-.913.49-1.302.48-.429-.01-1.253-.242-1.866-.441-.752-.245-1.35-.374-1.297-.79.027-.216.326-.437.896-.663 3.514-1.53 5.857-2.54 7.028-3.03 3.347-1.392 4.042-1.634 4.495-1.642.1-.002.32.023.463.14.12.097.153.23.17.337.016.107.036.344.02.532z"/>
            </svg>
        </div>
        
        <h2>Вход в аккаунт</h2>
        <p class="subtitle">
            Нажмите на кнопку ниже, чтобы авторизоваться через ваш Telegram аккаунт
        </p>

        <!-- Контейнер для виджета Telegram -->
        <div class="widget-container">
            <script async src="https://telegram.org/js/telegram-widget.js?22"
                    data-telegram-login="bayramauth1247bot"
                    data-size="large"
                    data-auth-url="tglogin://result"
                    data-request-access="write">
            </script>
        </div>

        <p class="note">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Вам придёт уведомление в Telegram для подтверждения входа
        </p>
    </div>
</body>
</html>
